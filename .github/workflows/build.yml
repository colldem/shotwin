name: build
on:
  push:
    branches: [main]
    paths-ignore: ["bin/**", "README.md"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --onefile --windowed --name ShotWin shotwin.py
      - uses: actions/upload-artifact@v4
        with: { name: ShotWin, path: dist/ShotWin.exe }
      # keep a ready-to-run exe in the repo so "Download ZIP" includes it
      - name: Commit exe to bin/
        shell: bash
        run: |
          mkdir -p bin && cp dist/ShotWin.exe bin/ShotWin.exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/ShotWin.exe
          git diff --cached --quiet || git commit -m "Update bin/ShotWin.exe [skip ci]"
          git push
